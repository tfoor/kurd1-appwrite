<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f43f76"><title>تفصيل فستان | ستايل روج</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#f43f76;--deep:#c9245a;--ink:#3f1424;--muted:#8a727d;--line:#f1dce4;--soft:#fff5f8}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:Cairo,sans-serif;background:#fffafb;color:var(--ink);padding-top:64px}
button{font:inherit;color:inherit;cursor:pointer}
header{position:fixed;inset:0 0 auto;height:60px;background:#fffffff0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;z-index:20;backdrop-filter:blur(10px)}
header img{height:38px}.back{color:var(--deep);font-weight:700;text-decoration:none;font-size:14px}
.intro{text-align:center;padding:22px 16px 6px}.intro h1{font:400 34px Lalezar;line-height:1.3}.intro p{color:var(--muted);font-size:14px;margin-top:4px}
.wrap{max-width:1120px;margin:auto;padding:14px 16px 110px;display:grid;grid-template-columns:1fr 360px;gap:22px;align-items:start}
.steps{display:flex;flex-direction:column;gap:18px;min-width:0}
.step{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:14px}.sh i{font-style:normal;flex:none;width:30px;height:30px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.sh h2{font-size:17px;font-weight:800}.sh small{color:var(--muted);font-size:12px;margin-inline-start:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ow{position:relative}
.co{width:100%;background:#fff;border:2px solid var(--line);border-radius:18px;padding:8px;text-align:center;display:flex;flex-direction:column;gap:3px;transition:.15s}
.co:hover{border-color:#f7b3c8}.co.on{border-color:var(--pink);background:var(--soft);box-shadow:0 8px 20px rgba(244,63,118,.15)}
.co.on::after{content:"✓";position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;background:var(--pink);color:#fff;font-size:13px;display:grid;place-items:center}
.co .im{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;border-radius:12px;background:#faecef;display:block}
.co b{font-size:14px}.co small{font-size:11.5px;color:var(--muted);line-height:1.4}.pr{color:var(--deep);font-weight:800;font-size:13px}
.none{aspect-ratio:3/4;border-radius:12px;background:#faecef;display:grid;place-items:center;font-size:34px}
.zb{position:absolute;top:14px;left:14px;border:0;background:#fffffff0;border-radius:20px;padding:4px 10px;font-size:11.5px;font-weight:700;box-shadow:0 3px 10px #0002}
.sw{display:flex;flex-wrap:wrap;gap:12px}.sw button{background:none;border:0;width:70px;text-align:center}
.dot{display:block;width:46px;height:46px;border-radius:50%;margin:0 auto 4px;border:3px solid #fff;box-shadow:0 0 0 1.5px #0003;object-fit:cover}
.sw button.on .dot{box-shadow:0 0 0 3px var(--pink)}.sw span{font-size:12px;font-weight:700}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ty{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px;text-align:right}
.ty.on{border-color:var(--pink);background:var(--soft)}.ty .im{width:42px;height:42px;border-radius:10px;object-fit:cover}.ty div{flex:1;font-weight:700;font-size:14px}
.meas{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:center}.meas svg{width:100%}
.mf{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{display:block;font-size:12.5px;font-weight:700;margin-bottom:3px}
.f input{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:#fff}.f input:focus{outline:0;border-color:var(--pink)}.f input.err{border-color:#e11;background:#fff0f0}
.side{position:sticky;top:76px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 16px 40px rgba(72,28,46,.08)}
.pv{position:relative;background:radial-gradient(circle at 50% 35%,#ffe1ea,#fff 72%);border-radius:18px;height:380px;display:grid;place-items:center}
.pv>img{max-height:360px;max-width:92%;object-fit:contain}
.arr{position:absolute;top:44%;width:36px;height:36px;border-radius:50%;border:0;background:var(--pink);color:#fff;font-size:16px}.arr.l{left:8px}.arr.r{right:8px}
.pz{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);border:0;background:#fff;color:var(--deep);font-weight:800;font-size:12.5px;border-radius:20px;padding:7px 16px;box-shadow:0 4px 14px #0002;white-space:nowrap}
.inset{position:absolute;top:10px;right:10px;width:70px;border-radius:12px;border:2px solid #fff;box-shadow:0 4px 12px #0003;cursor:zoom-in}
.row{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:8px 0;border-bottom:1px dashed var(--line)}.row b{color:var(--deep);white-space:nowrap}.row em{display:block;font-style:normal;font-size:11.5px;color:var(--muted)}
.total{display:flex;justify-content:space-between;align-items:center;margin:12px 0 4px;font-weight:800}.total b{font-size:26px;color:var(--deep)}
.send{width:100%;border:0;border-radius:16px;padding:15px;background:linear-gradient(145deg,#ff5a8c,#d92d62);color:#fff;font-weight:800;font-size:16px;box-shadow:0 10px 22px rgba(217,45,98,.3)}
.fsum{display:none;margin-bottom:14px;background:var(--soft);border-radius:16px;padding:6px 14px}
.bar{display:none}
#lb{position:fixed;inset:0;background:#000d;display:none;z-index:99;overflow:auto;padding:56px 10px 20px;text-align:center}#lb.show{display:block}
#lb img{max-width:92vw;max-height:86vh;cursor:zoom-in;border-radius:12px;background:#fff}#lb img.z{max-width:none;max-height:none;width:190vw;cursor:zoom-out}
#lb button{position:fixed;top:12px;left:12px;border:0;border-radius:50%;width:40px;height:40px;font-size:18px;background:#fff}
#toast{position:fixed;bottom:90px;left:50%;transform:translate(-50%,20px);background:#3f1424;color:#fff;padding:10px 20px;border-radius:24px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:100}#toast.show{opacity:1;transform:translate(-50%,0)}
.empty{color:var(--muted);font-size:13px;padding:8px}
@media(max-width:900px){
 .wrap{grid-template-columns:1fr;padding-bottom:100px}.side{position:static;order:-1;padding:12px}.side .sumside{display:none}
 .pv{height:300px}.pv>img{max-height:280px}.fsum{display:block}.meas{grid-template-columns:1fr}.meas svg{max-width:170px;margin:auto}
 .cards{grid-template-columns:repeat(2,1fr)}
 .bar{display:flex;position:fixed;inset:auto 0 0;z-index:30;background:#fffffff5;border-top:1px solid var(--line);padding:10px 16px;align-items:center;justify-content:space-between;backdrop-filter:blur(10px)}
 .bar b{font-size:20px;color:var(--deep)}.bar button{border:0;border-radius:14px;padding:12px 20px;background:var(--pink);color:#fff;font-weight:800}
}
.hr{display:flex;align-items:center;gap:14px}
.ub{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 14px;font-weight:700;font-size:13px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#am{position:fixed;inset:0;background:#0007;display:none;z-index:98;align-items:center;justify-content:center;padding:16px}#am.show{display:flex}
.amb{position:relative;background:#fff;border-radius:22px;padding:22px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
.amb h3{font-size:20px;margin-bottom:2px}.amb input{padding:12px;border:1.5px solid var(--line);border-radius:12px;font:inherit}.amb input:focus{outline:0;border-color:var(--pink)}
.amx{position:absolute;top:12px;left:12px;border:0;background:none;font-size:18px}
#amErr{color:#d11;font-size:13px;min-height:16px}#amGo{border:0;border-radius:14px;padding:13px;background:linear-gradient(145deg,#ff5a8c,#d92d62);color:#fff;font-weight:800}#amGo:disabled{opacity:.6}
#amSw{text-align:center;font-size:13px}#amSw a{color:var(--deep);font-weight:700}
.co.cm{border-style:dashed}
/* ===== زر تبديل العرض (الفستان/الخفتان) جنب عنوان القسم ===== */
.sh{flex-wrap:wrap}
.kindtg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.ktb{border:0;background:none;padding:6px 12px;border-radius:9px;font-size:11.5px;font-weight:800;color:var(--muted)}
.ktb.on{background:var(--pink);color:#fff}
</style><style>
html.in-app,html.in-app body{touch-action:pan-x pan-y}
html.in-app body{padding-top:0!important}
html.in-app body>header{display:none!important;visibility:hidden!important}
html.in-app .bar{display:none!important}
</style>

</head><body>
<header><img src="logo/style-rouge.webp" alt="ستايل روج"><div class="hr"><button class="ub" id="userBtn">👤 تسجيل الدخول</button><a class="back" href="index.html">← رجوع</a></div></header>
<div class="intro"><h1>صمّمي فستانك بنفسك</h1><p class="sub">اختاري التفاصيل خطوة بخطوة، والسعر بيتحدّث معك</p></div>
<div class="wrap">
 <div class="steps">
  <section class="step"><div class="sh"><i>1</i><h2>اختاري الموديل</h2></div><div class="cards" id="designs"></div></section>
  <section class="step" id="stepDress"><div class="sh"><i>2</i><h2>الفستان</h2>
    <div class="kindtg">
     <button class="ktb" data-tg="2" data-kind="kaftan" onclick="setSecView(2,'kaftan')">خفتان</button>
     <button class="ktb on" data-tg="2" data-kind="model" onclick="setSecView(2,'model')">الفستان</button>
    </div>
    <small id="n2">نوع القماش</small></div><div class="cards" id="models"></div></section>
  <section class="step" id="stepKaftan"><div class="sh"><i>3</i><h2>الخفتان</h2>
    <div class="kindtg">
     <button class="ktb on" data-tg="3" data-kind="kaftan" onclick="setSecView(3,'kaftan')">الخفتان</button>
     <button class="ktb" data-tg="3" data-kind="model" onclick="setSecView(3,'model')">فستان</button>
    </div>
    <small id="n3">اختياري</small></div><div class="cards" id="kaftans"></div></section>
  <section class="step" id="stepLiningColor"><div class="sh"><i>4</i><h2>لون البطان</h2><small id="colName"></small></div><div class="sw" id="colors"></div></section>
  <section class="step" id="stepLiningType"><div class="sh"><i>5</i><h2>نوع البطان</h2><small id="n5"></small></div><div class="types" id="linings"></div></section>
  <section class="step" id="measure"><div class="sh"><i>6</i><h2>المقاسات</h2><small>بالسنتيمتر</small></div>
   <div class="fsum" id="fsum"></div>
   <div class="meas">
    <svg viewBox="0 0 200 330" fill="none" stroke="#e8708f" stroke-width="2"><path d="M70 20 Q100 45 130 20 L140 60 L118 130 L190 310 H10 L82 130 L60 60Z" fill="#ffd9e4"/><g stroke-dasharray="5 4" stroke="#d92d62"><path d="M62 52H138"/><path d="M80 90H120"/><path d="M82 130H118"/><path d="M45 245H155"/><path d="M18 20V310"/></g><g fill="#6c233d" stroke="none" font-size="11" font-family="Cairo"><text x="76" y="44">الكتف</text><text x="86" y="86">الصدر</text><text x="86" y="126">الخصر</text><text x="82" y="241">الورك</text><text x="22" y="170">الطول</text></g></svg>
    <div class="mf" id="mf"></div></div>
   <button class="send" id="sendM" style="margin-top:16px">إرسال الطلب عبر واتساب 📲</button></section>
 </div>
 <aside class="side">
  <div class="pv"><button class="arr l" id="prev">←</button><img id="hero" alt=""><button class="arr r" id="next">→</button><button class="pz" id="zoomDress" style="display:none">⌕ تكبير الصورة</button></div>
  <div class="sumside"><div id="rows"></div><div class="total"><span>الإجمالي</span><b id="total"></b></div><button class="send" id="send">أكملي المقاسات ↓</button></div>
 </aside>
</div>
<div class="bar"><div>الإجمالي <b id="total2"></b></div><button id="goM">أكملي المقاسات ↓</button></div>
<input type="file" id="cmFile" accept="image/*" hidden>
<div id="am"><div class="amb"><button class="amx" onclick="closeAuth()">✕</button><h3 id="amT"></h3>
<input id="amName" placeholder="الاسم" autocomplete="name"><input id="amEmail" type="email" placeholder="الإيميل" dir="ltr" autocomplete="email"><input id="amPass" type="password" placeholder="كلمة السر" dir="ltr" autocomplete="current-password">
<div id="amErr"></div><button id="amGo"></button><p id="amSw"></p></div></div>
<div id="lb"><button onclick="closeLb()">✕</button><img id="lbImg" alt=""></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/appwrite@26.2.0"></script>
<script>
/* إعدادات الموقع (صارت داخل الصفحة، فما عادت تحتاج store.js) */
const SR={ENDPOINT:"https://api.styleroj.com/v1",PROJECT:"6a9321f3002b6c1004a9",DATABASE:"6a93224c002e35f858b8",WHATSAPP:"9647511429970",CUR:"$",
 money:v=>"$"+Number(v||0).toFixed(2)};
</script>
<script>
/* ID جدول designer_options الحقيقي بـ Appwrite (نفس اللي بالأدمن) */
const TABLE_ID="6acba36b001e0aba51e4";
/* جدول الفواتير وباكيت صور الزبونات (لازم يتعملوا بـ Appwrite بنفس هالـ ID) */
const INV_TABLE="6ad51224003232aa7106",UP_BUCKET="customer-uploads";
/* نفس إعدادات الموقع الأساسي => نفس الجلسة: إذا سجلتي من الصفحة الرئيسية بتضلي مسجلة هون والعكس */
const AW=new Appwrite.Client().setEndpoint(SR.ENDPOINT).setProject(SR.PROJECT),awAccount=new Appwrite.Account(AW),awDB=new Appwrite.TablesDB(AW),awStorage=new Appwrite.Storage(AW);
let USER=null,pendingSend=false;
let D;const M=[["a","الصدر"],["b","الطول"],["c","طول الأكمام"],["d","الكتف"],["e","عرض الكم"],["f","طرف الكم"],["g","الخصر"],["h","الورك"]];
const S={useCustom:false,custom:null,d:0,dress:null,color:null,lining:null,kaftan:null,parts:[],total:0,secView:{2:'model',3:'kaftan'}};
const $=id=>document.getElementById(id),$$=SR.money;
const esc=t=>String(t==null?"":t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const by=(a,id)=>D[a].find(x=>x.id===id);
let toastT;function toast(t,ms){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),ms||2200)}
async function loadAll(){
 const db=awDB,rows=[];let off=0;
 for(;;){const r=await db.listRows({databaseId:SR.DATABASE,tableId:TABLE_ID,queries:[Appwrite.Query.orderAsc('$createdAt'),Appwrite.Query.limit(100),Appwrite.Query.offset(off)]});const b=r.rows||r.documents||[];rows.push(...b);if(b.length<100)break;off+=100}
 const cnt={};rows.forEach(x=>cnt[x.kind]=(cnt[x.kind]||0)+1);
 const g=k=>rows.filter(x=>x.kind===k).map(x=>({id:x.$id,name:x.name,price:+x.price||0,hex:x.hex||'#f3b5c7',img:x.img||'',fabric:x.fabric||'',mdress:parseFloat(x.mdress||x.mult)||1,mkaftan:parseFloat(x.mkaftan||x.mdress||x.mult)||1,mlining:parseFloat(x.mlining||x.mult)||1,showDress:x.showDress!==false,showKaftan:x.showKaftan!==false,showLining:x.showLining!==false,allowSwap:x.allowSwap!==false}));
 return{cnt,designs:g('design'),models:g('model'),kaftans:g('kaftan'),colors:g('color'),linings:g('fabric')};
}
function openLb(src){if(!src)return;$('lbImg').className='';$('lbImg').src=src;$('lb').classList.add('show')}
function closeLb(){$('lb').classList.remove('show')}
$('lbImg').onclick=e=>{e.stopPropagation();e.target.classList.toggle('z')};$('lb').onclick=e=>{if(e.target.id==='lb')closeLb()};
document.addEventListener('keydown',e=>e.key==='Escape'&&closeLb());
$('mf').innerHTML=M.map(([k,n])=>`<div class="f"><label>${n} (${k})</label><input id="m-${k}" type="number" min="1" inputmode="decimal" placeholder="سم"></div>`).join('');
const im=x=>x.img?`<img class="im" src="${esc(x.img)}" alt="" loading="lazy">`:`<div class="im"></div>`;
const zb=x=>x.img?`<button class="zb" data-z="${esc(x.img)}">⌕</button>`:'';
/* أي قماش (فستان أو خفتان) ممكن يترجموه لنفس الـ id-space، فنلاقيه بغض النظر من أي كتالوج */
const anyBy=id=>id?(D.models.find(x=>x.id===id)||D.kaftans.find(x=>x.id===id)):null;
/* بطاقات نوع القماش — كل قسم (2=الفستان، 3=الخفتان) إله سلوت ثابت خاص فيه (data-s2/data-s3)
   وX خاص فيه (قياس الفستان أو قياس الخفتان)، بغض النظر عن الكتالوج (كتالوج الفستان أو
   كتالوج الخفتان) يلي عم تتعرض صوره حالياً جوا هالقسم بسبب زر التبديل. يعني تبديل مصدر
   القماش بغيّر الصور المعروضة بس، وما بغيّر لأي قسم القماش هاد منسوب ولا X يلي بينحسب فيه. */
function cardsHTML(sectionNum){
 const viewKind=S.secView[sectionNum];
 const src=viewKind==='kaftan'?D.kaftans:D.models;
 const mult=sectionNum===2?KD():KK();
 const selId=sectionNum===2?S.dress:S.kaftan;
 const attr=sectionNum===2?'data-s2':'data-s3';
 const itemsHTML=src.map(x=>`<div class="ow"><button class="co ${x.id===selId?'on':''}" ${attr}="${esc(x.id)}">${im(x)}${info(x,mult)}</button>${zb(x)}</div>`).join('');
 if(sectionNum===3){

 }
 return itemsHTML||'<p class="empty">لا توجد خيارات بعد</p>';
}
const SEC_LABEL={model:'نوع القماش',kaftan:'اختياري'};
function setSecView(n,kind){S.secView[n]=kind;draw()}
function renderToggles(){
 [2,3].forEach(n=>{
  document.querySelectorAll(`[data-tg="${n}"]`).forEach(b=>b.classList.toggle('on',b.dataset.kind===S.secView[n]));
  const lbl=$('n'+n);if(lbl)lbl.textContent=SEC_LABEL[S.secView[n]];
 });
}
/* كمية القماش للموديل (x1/x2/x3) بتنحط من الأدمن وبتضرب أسعار الفستان والخفتان ونوع البطان بصمت، بدون ما تظهر للزبونة */
/* الموديل الحالي: من القائمة أو موديل الزبونة اللي رفعته */
const curD=()=>S.useCustom&&S.custom?{name:'موديلك الخاص',img:S.custom.url,price:0,mdress:1,mkaftan:1,mlining:1,custom:1,showDress:true,showKaftan:true,showLining:true,allowSwap:true}:((D&&D.designs[S.d])||{});
const KD=()=>curD().mdress||1;    /* قياس الفستان */
const KK=()=>curD().mkaftan||curD().mdress||1;  /* قياس الخفتان لحاله (إذا ما محدد بالأدمن، بيرجع لقياس الفستان للتوافق مع تصاميم قديمة) */
const KL=()=>curD().mlining||1;   /* قياس البطان */
const showDress=()=>curD().showDress!==false;    /* إذا false، هاد الموديل ما إله قسم فستان مستقل */
const showKaftan=()=>curD().showKaftan!==false;   /* إذا false، ما يظهر قسم الخفتان إطلاقاً */
const showLining=()=>curD().showLining!==false;   /* إذا false، ما يظهر قسم لون/نوع البطان */
const allowSwap=()=>curD().allowSwap!==false; /* التبديل بس إذا فعّال وبوجود القسمين الاتنين */
const info=(x,mult)=>`<b>${esc(x.name)}</b>${x.fabric?`<small>${esc(x.fabric)}</small>`:''}<span class="pr">${$$(x.price*mult)}</span>`;
/* تطبّق إعدادات الموديل الحالي: تظهر/تخفي الأقسام، وتظهر/تخفي أزرار التبديل */
function applyModelConfig(){
 const sd=showDress(),sk=showKaftan(),sl=showLining(),as=allowSwap();
 const elD=$('stepDress');if(elD)elD.style.display=sd?'':'none';
 const elK=$('stepKaftan');if(elK)elK.style.display=sk?'':'none';
 const elC=$('stepLiningColor');if(elC)elC.style.display=sl?'':'none';
 const elT=$('stepLiningType');if(elT)elT.style.display=sl?'':'none';
 document.querySelectorAll('.kindtg').forEach(el=>el.style.display=as?'':'none');
 if(!as){S.secView[2]='model';S.secView[3]='kaftan'}
}
function draw(){
 applyModelConfig();
 const de=curD(),sd=showDress(),sk=showKaftan(),sl=showLining();
 const dr=sd?anyBy(S.dress):null,ka=sk?anyBy(S.kaftan):null,co=sl?by('colors',S.color):null,li=sl?by('linings',S.lining):null;
 const cmCard=`<div class="ow"><button class="co cm ${S.useCustom&&S.custom?'on':''}" data-cm="1">${S.custom?`<img class="im" src="${S.custom.url}" alt="">`:'<div class="none" style="font-size:38px">➕</div>'}<b>${S.custom?'موديلك الخاص':'أضيفي موديلك بنفسك'}</b><small>${S.custom?(S.useCustom?'اضغطي لتغيير الصورة':'اضغطي لاختياره'):'ارفعي صورة الموديل اللي بدك تفصّليه'}</small></button>${S.custom?`<button class="zb" data-z="${S.custom.url}">⌕</button>`:''}</div>`;
 $('designs').innerHTML=(D.designs.map((x,i)=>`<div class="ow"><button class="co ${!S.useCustom&&i==S.d?'on':''}" data-g="${i}">${im(x)}<b>${esc(x.name)}</b><span class="pr">${$$(x.price)}</span></button>${zb(x)}</div>`).join('')||'<p class="empty">لا توجد موديلات بعد</p>')+cmCard;
 if(sd)$('models').innerHTML=cardsHTML(2);
 if(sk)$('kaftans').innerHTML=cardsHTML(3);
 renderToggles();
 if(sl){
  $('colors').innerHTML=D.colors.map(x=>`<button class="${x.id==S.color?'on':''}" data-c="${esc(x.id)}">${x.img?`<img class="dot" src="${esc(x.img)}" alt="">`:`<span class="dot" style="background:${esc(x.hex)}"></span>`}<span>${esc(x.name)}</span></button>`).join('')||'<p class="empty">لا توجد ألوان بعد</p>';
  $('colName').textContent=co?co.name:'';
  $('linings').innerHTML=D.linings.map(x=>`<button class="ty ${x.id==S.lining?'on':''}" data-l="${esc(x.id)}">${x.img?`<img class="im" src="${esc(x.img)}" alt="">`:''}<div>${esc(x.name)}</div><span class="pr">${$$(x.price*KL())}</span></button>`).join('')||'<p class="empty">لا توجد أنواع بطان بعد</p>';
 }
 S.pv=de.img||(dr&&dr.img)||(ka&&ka.img)||'';$('hero').style.display=S.pv?'':'none';$('hero').src=S.pv;$('zoomDress').style.display=S.pv?'':'none';
 const kd=KD(),kk=KK(),kl=KL();
 const parts=[["الموديل",de.name,de.custom?null:de.price,de.custom?"السعر بيتحدد بعد مراجعة الصورة":""],
  ...(sd?[["الفستان",dr&&dr.name,dr?dr.price*kd:0,dr&&dr.fabric]]:[]),
  ...(sk?[["الخفتان",ka?ka.name:"بدون خفتان",ka?ka.price*kk:0,ka&&ka.fabric]]:[]),
  ...(sl?[["لون البطان",co&&co.name,null],["نوع البطان",li&&li.name,li?li.price*kl:0]]:[])];
 const h=parts.map(p=>`<div class="row"><span>${p[0]}: ${esc(p[1]||'-')}${p[3]?`<em>${esc(p[3])}</em>`:''}</span>${p[2]==null?'':`<b>${$$(p[2])}</b>`}</div>`).join('');
 S.total=parts.reduce((t,p)=>t+(+p[2]||0),0);S.parts=parts;
 $('rows').innerHTML=h;$('fsum').innerHTML=h+`<div class="total"><span>الإجمالي</span><b>${$$(S.total)}</b></div>`;$('total').textContent=$$(S.total);$('total2').textContent=$$(S.total);
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-g],[data-s2],[data-s3],[data-c],[data-l],[data-z],[data-cm]');if(!t)return;
 if(t.dataset.z)return openLb(t.dataset.z);
 if('cm' in t.dataset){if(S.custom&&!S.useCustom){S.useCustom=true;return draw()}return $('cmFile').click()}
 if('g' in t.dataset){S.d=+t.dataset.g;S.useCustom=false}
 if('s2' in t.dataset)S.dress=t.dataset.s2||null;
 if('s3' in t.dataset)S.kaftan=t.dataset.s3||null;
 if('c' in t.dataset)S.color=t.dataset.c;
 if('l' in t.dataset)S.lining=t.dataset.l;
 draw();
});
$('zoomDress').onclick=()=>openLb(S.pv);
const step=d=>{if(!D.designs.length)return;S.useCustom=false;S.d=(S.d+d+D.designs.length)%D.designs.length;draw()};$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
const goM=()=>$('measure').scrollIntoView();$('goM').onclick=goM;$('send').onclick=goM;
/* ===== موديل الزبونة (رفع صورة) ===== */
function toWebp(file,max){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('تعذر معالجة الصورة')),'image/webp',.82)};im.onerror=()=>rej(new Error('ملف الصورة غير صالح'));im.src=u})}
$('cmFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(!/^image\//.test(f.type))return toast('اختاري ملف صورة');
 try{const b=await toWebp(f,1400);if(S.custom)URL.revokeObjectURL(S.custom.url);S.custom={blob:b,url:URL.createObjectURL(b)};S.useCustom=true;draw();toast('✅ تمت إضافة موديلك')}catch(err){toast(err.message||'تعذر قراءة الصورة')}};

/* ===== تسجيل الدخول (نفس جلسة الموقع الأساسي) ===== */
const uname=u=>u.name||(u.email||'').split('@')[0];
function renderUser(){$('userBtn').textContent=USER?'👤 '+uname(USER):'👤 تسجيل الدخول'}
async function refreshUser(){try{USER=await awAccount.get()}catch(e){USER=null}renderUser()}
$('userBtn').onclick=async()=>{if(!USER)return openAuth('login');
 if(confirm('تسجيل الخروج من حساب '+uname(USER)+'؟')){try{await awAccount.deleteSession({sessionId:'current'})}catch(e){}USER=null;renderUser();toast('تم تسجيل الخروج')}};
let amode='login';
function openAuth(m){amode=m||'login';drawAuth();$('am').classList.add('show')}
function closeAuth(){$('am').classList.remove('show');pendingSend=false}
function drawAuth(){const r=amode==='register';$('amT').textContent=r?'حساب جديد':'تسجيل الدخول';$('amName').style.display=r?'':'none';$('amGo').textContent=r?'إنشاء الحساب':'دخول';
 $('amSw').innerHTML=r?'عندك حساب؟ <a href="#" data-sw="login">سجّلي دخول</a>':'ما عندك حساب؟ <a href="#" data-sw="register">أنشئي حساب</a>';$('amErr').textContent=''}
$('am').addEventListener('click',e=>{if(e.target.id==='am')return closeAuth();const a=e.target.closest('[data-sw]');if(a){e.preventDefault();amode=a.dataset.sw;drawAuth()}});
$('amPass').addEventListener('keydown',e=>e.key==='Enter'&&$('amGo').click());
$('amGo').onclick=async()=>{
 const em=$('amEmail').value.trim(),pw=$('amPass').value,nm=$('amName').value.trim(),err=t=>$('amErr').textContent=t;
 if(!em||!pw)return err('اكتبي الإيميل وكلمة السر');
 if(amode==='register'){if(!nm)return err('اكتبي اسمك');if(pw.length<8)return err('كلمة السر لازم 8 أحرف على الأقل')}
 $('amGo').disabled=true;
 try{
  if(amode==='register')await awAccount.create({userId:Appwrite.ID.unique(),email:em,password:pw,name:nm});
  await awAccount.createEmailPasswordSession({email:em,password:pw});
  await refreshUser();const again=pendingSend;closeAuth();$('amPass').value='';toast('أهلًا '+(USER?uname(USER):''));
  if(again)send();
 }catch(e){err(e.code===401?'الإيميل أو كلمة السر غلط':e.code===409?'هذا الإيميل مسجل من قبل، سجّلي دخول':e.code===429?'محاولات كتير، جربي بعد شوي':(e.message||'صار خطأ'))}
 $('amGo').disabled=false;
};

/* ===== إرسال الطلب: حفظ الفاتورة بالأدمن + واتساب ===== */
async function send(){
 const miss=M.find(([k])=>!$('m-'+k).value.trim());
 M.forEach(([k])=>$('m-'+k).classList.toggle('err',!$('m-'+k).value.trim()));
 if(miss){$('m-'+miss[0]).focus();return toast('أكملي كل المقاسات أول')}
 if(!USER){pendingSend=true;toast('سجّلي دخول أول حتى نحفظ فاتورتك');return openAuth('login')}
 const btn=$('sendM');btn.disabled=true;btn.textContent='جاري حفظ الفاتورة...';
 let no='SR-'+Date.now().toString().slice(-6),custom=null,upErr='';
 try{
  const de=curD(),sd=showDress(),sk=showKaftan(),sl=showLining();
  const dr=sd?anyBy(S.dress):null,ka=sk?anyBy(S.kaftan):null,co=sl?by('colors',S.color):null,li=sl?by('linings',S.lining):null;
  const kd=KD(),kk=KK(),kl=KL();
  if(S.useCustom&&S.custom){
   try{
    const fid=Appwrite.ID.unique();
    await awStorage.createFile({bucketId:UP_BUCKET,fileId:fid,file:new File([S.custom.blob],'custom-model.webp',{type:S.custom.blob.type||'image/webp'})});
    custom={id:fid,url:SR.ENDPOINT+'/storage/buckets/'+UP_BUCKET+'/files/'+fid+'/view?project='+SR.PROJECT};
   }catch(e){console.error(e);upErr=e.message||String(e);toast('تعذر رفع صورة الموديل: '+upErr,9000)}
  }
  const inv={model:{n:custom?'موديلك الخاص':de.name,i:custom?custom.url:de.img,p:custom?null:de.price},
   dress:dr?{n:dr.name,i:dr.img,f:dr.fabric,p:dr.price*kd}:null,kaftan:ka?{n:ka.name,i:ka.img,f:ka.fabric,p:ka.price*kk}:null,
   color:co?{n:co.name,h:co.hex,i:co.img}:null,lining:li?{n:li.name,i:li.img,p:li.price*kl}:null,
   measures:Object.fromEntries(M.map(([k,n])=>[n+' ('+k+')',$('m-'+k).value])),custom,total:S.total};
  const row=await awDB.createRow({databaseId:SR.DATABASE,tableId:INV_TABLE,rowId:Appwrite.ID.unique(),
   data:{userId:USER.$id,name:uname(USER),email:USER.email,total:S.total,status:'new',data:JSON.stringify(inv)}});
  no='SR-'+String(row.$id).slice(-6).toUpperCase();if(!upErr)toast('✅ انحفظت فاتورتك');
 }catch(e){console.error(e);toast('تعذر حفظ الفاتورة: '+(e.message||e),9000)}
 btn.disabled=false;btn.textContent='إرسال الطلب عبر واتساب 📲';
 const msg=["🧾 *فاتورة طلب تفصيل — ستايل روج*","رقم الفاتورة: "+no,"👤 الاسم: "+uname(USER),"",
  ...S.parts.map(p=>`${p[0]}: ${p[1]||'-'}${p[3]?' ('+p[3]+')':''}${p[2]==null?'':' — '+$$(p[2])}`),
  ...(custom?["🖼️ صورة موديل الزبونة: "+custom.url]:(S.useCustom&&S.custom?["⚠️ الزبونة اختارت موديلها الخاص بس الصورة ما انرفعت، رح ترسلها بالواتساب"]:[])),"","📏 *المقاسات*",
  ...M.map(([k,n])=>`${n} (${k}): ${$('m-'+k).value} سم`),"",`💰 *الإجمالي: ${$$(S.total)}*`,"✅ أريد تأكيد الطلب."].join("\n");
 const url="https://wa.me/"+SR.WHATSAPP+"?text="+encodeURIComponent(msg),w=window.open(url,"_blank");if(!w)location.href=url;
}
$('sendM').onclick=send;
refreshUser();
loadAll().then(d=>{D=d;S.dress=d.models[0]&&d.models[0].id;
  if(!d.designs.length||!d.models.length){const c=d.cnt;document.querySelector('.sub').textContent='الموجود بالجدول: موديلات '+(c.design||0)+' • فساتين '+(c.model||0)+' • خفاتين '+(c.kaftan||0)+' • ألوان '+(c.color||0)+' • أنواع بطان '+(c.fabric||0)}
  S.color=d.colors[0]&&d.colors[0].id;S.lining=d.linings[0]&&d.linings[0].id;draw()})
 .catch(e=>{console.error(e);document.querySelector('.sub').textContent='تعذر تحميل الخيارات: '+(e.message||e)});
</script></body></html>
